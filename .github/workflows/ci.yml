# CI – chạy khi mở/cập nhật Pull Request và khi push lên main
# Sprint 1 (Task 4.4): Install → Lint → Unit Test → Build
# Branch protection trên main yêu cầu các job này pass trước khi merge
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_call: # cho phép cd.yml tái sử dụng làm quality gate

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API – lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      JWT_SECRET: ci-only-secret-not-for-production-0123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: npm test -- --ci
      - name: Build
        run: npm run build

  web:
    name: Web – lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit / component test
        run: npm test
      - name: Build
        run: npm run build
